<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henry Greer | API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js" defer></script> 
    <!-- <link rel="stylesheet" href="styles.css">     -->
</head>


<body class="bg-dark">

    <header class="text-center text-bg-secondary p-4">
        <h1 class="fw-bold">Henry Greer</h1>
        <h2 class="fw-bold">Week 5/6 - API Exercise + JQuery</h2>
    </header>



<main class="container">

        <button class="btn btn-outline-danger" onclick="getMeal()">
            What to eat tonight?
        </button>

        <p id="mealError" class="alert alert-danger d-none">Sorry, there was a problem loading the meal. Please try again. If the problem persists, please contact me.</p>

        <div class="card meal-card bg-secondary m-4 p-4 d-none">
            <h1 class="mealId fw-bold text-white" id="dish"></h1>
            <div class="mealId" id="thumb"></div>
        </div>

        <div class="row g-4">

            <div class="col-md-6">
                <div class="card meal-card bg-secondary p-4 d-none">
                    <h2 class="fw-bold text-white">Category</h2>
                    <div class="mealId" id="category"></div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card meal-card bg-secondary p-4 d-none">
                    <h2 class="fw-bold text-white">Area</h2>
                    <div class="mealId" id="area"></div>
                </div>
            </div>

        </div>
        
        <div class="card meal-card bg-secondary m-4 p-4 d-none">
                <h2 class="fw-bold text-white">Ingredients</h2>
                <div class="mealId" id="ingredients"></div>
        </div>
        
        <div class="card meal-card bg-secondary m-4 p-4 d-none">
                <h2 class="fw-bold text-white">Instructions</h2>
                <div class="mealId" id="instructions"></div>
        </div>

        <div class="card meal-card bg-secondary m-4 p-4 d-none">
                <h2 class="fw-bold text-white">YouTube</h2>
                <div class="mealId" id="youtube"></div>
        </div>

        <div class="card meal-card bg-secondary m-4 p-4 d-none">
                <h2 class="fw-bold text-white">Source</h2>
                <div id="source" class="mealId"></div>
        </div>

    
        <p>
            <a href="index.html" class="btn btn-outline-danger">Back to Portfolio</a>
        </p>

    </main>

    <footer class ="text-center text-bg-secondary p-4">
        <p>
            Henry Greer | Web Development | Sheffield Hallam University
        </p>
    </footer>



</body>
</html>
